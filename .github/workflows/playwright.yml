name: Playwright Tests

run-name: "Playwright | ${{ inputs.suite || 'all' }} | ${{ github.event_name }}"

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      suite:
        description: "Select the test suite"
        required: true
        default: all
        type: choice
        options:
          - all
          - ui
          - api

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    outputs:
      pages_ready: ${{ steps.pages_package.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        if: github.event_name != 'workflow_dispatch' || inputs.suite != 'api'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        shell: bash
        env:
          TEST_SUITE: ${{ inputs.suite || 'all' }}
          DEMOQA_USERNAME: ${{ secrets.DEMOQA_USERNAME }}
          DEMOQA_PASSWORD: ${{ secrets.DEMOQA_PASSWORD }}
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
          REQRES_BASE_URL: "https://reqres.in"
          REQRES_COLLECTION: "users"
          REQRES_ENV: "prod"
        run: |
          case "$TEST_SUITE" in
            all)
              npx playwright test
              ;;
            ui)
              npx playwright test --project=ui-chromium
              ;;
            api)
              npx playwright test --project=api
              ;;
            *)
              echo "Unsupported test suite"
              exit 1
              ;;
          esac

      - name: Generate Allure report
        id: allure
        if: >-
          ${{ !cancelled() &&
              (steps.tests.outcome == 'success' ||
               steps.tests.outcome == 'failure') }}
        run: npx allure awesome allure-results --single-file --output allure-report/single-file

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/single-file/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Prepare report website
        id: website
        if: >-
          ${{ !cancelled() &&
              steps.allure.outcome == 'success' &&
              github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' ||
               github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          test -f allure-report/single-file/index.html
          test -f playwright-report/index.html

          mkdir -p report-site/allure report-site/playwright

          cp -R allure-report/single-file/. report-site/allure/
          cp -R playwright-report/. report-site/playwright/

          cat > report-site/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>FinacPlus Test Reports</title>
              <style>
                body {
                  font-family: system-ui, sans-serif;
                  max-width: 800px;
                  margin: 70px auto;
                  padding: 0 24px;
                  color: #17243b;
                  background: #f3f6fb;
                }
                main {
                  padding: 32px;
                  background: white;
                  border-radius: 16px;
                  border: 1px solid #dde5ef;
                }
                h1 { margin-top: 0; }
                p { line-height: 1.6; }
                a {
                  display: block;
                  margin: 14px 0;
                  padding: 16px;
                  border-radius: 8px;
                  background: #244dcc;
                  color: white;
                  text-decoration: none;
                  font-weight: 600;
                }
                a:hover { background: #183ba9; }
                a:focus-visible {
                  outline: 3px solid #f5b731;
                  outline-offset: 3px;
                }
              </style>
            </head>
            <body>
              <main>
                <h1>FinacPlus Test Reports</h1>
                <p>Reports from the latest published execution.</p>
                <a href="./allure/">Open Allure report</a>
                <a href="./playwright/">Open Playwright report</a>
                <a href="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">
                  View this workflow run
                </a>
                <a href="https://github.com/${GITHUB_REPOSITORY}/actions">
                  Run tests in GitHub Actions
                </a>
                <p>
                  To run tests, open Playwright Tests in GitHub Actions,
                  select Run workflow, choose main, and select all, ui, or api.
                </p>
              </main>
            </body>
          </html>
          HTML

      - name: Package report website
        id: pages_package
        if: ${{ !cancelled() && steps.website.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: report-site/

  deploy:
    name: Publish test reports
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.pages_ready == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
